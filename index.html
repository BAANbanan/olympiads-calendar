<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Календарь олимпиад 2026–2027</title>

    <!-- React & ReactDOM -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js">
    </script>

    <!-- Firebase (Compat v9) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js">
    </script>

    <style>
        /* ────────────── ГЛОБАЛЬНЫЙ СБРОС И ПЕРЕМЕННЫЕ ────────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-body: #faf8f5;
            --bg-card: #ffffff;
            --bg-header: #f3efe9;
            --text-primary: #3d3a36;
            --text-secondary: #6b6460;
            --text-light: #a09890;
            --border-light: #e8e0d8;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 6px 24px rgba(0, 0, 0, 0.07);
            --radius: 12px;
            --radius-sm: 6px;
            --transition: 0.2s ease;

            --pastel-blue: #dce8f0;
            --pastel-green: #dceee4;
            --pastel-pink: #f5e0e8;
            --pastel-lavender: #e8e0f0;
            --pastel-peach: #f5ede0;
            --pastel-mint: #ddf0ea;
            --pastel-yellow: #f5f0d8;
            --pastel-red: #f5d8d8;
            --pastel-coral: #f5e0d8;
            --level-1: #c8d8e8;
            --level-2: #d4e4d4;
            --level-3: #f0e0d0;
        }

        /* ─── ТЁМНАЯ ТЕМА ─── */
        [data-theme="dark"] {
            --bg-body: #1a1a1a;
            --bg-card: #2c2c2c;
            --bg-header: #2a2a2a;
            --text-primary: #e8e0d8;
            --text-secondary: #b0a8a0;
            --text-light: #888080;
            --border-light: #404040;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 6px 24px rgba(0, 0, 0, 0.5);
            --pastel-blue: #3a4a5a;
            --pastel-green: #3a5a4a;
            --pastel-red: #5a3a3a;
            --pastel-yellow: #5a4a2a;
            --level-1: #3a4a5a;
            --level-2: #3a5a4a;
            --level-3: #5a4a3a;
            --btn-primary-bg: #4a6a7a;
            --btn-primary-color: #e8e0d8;
            --btn-success-bg: #4a7a5a;
            --btn-success-color: #e8e0d8;
            --btn-danger-bg: #7a4a4a;
            --btn-danger-color: #e8e0d8;
            --btn-warning-bg: #7a6a3a;
            --btn-warning-color: #e8e0d8;
        }

        /* ─── БАНАННАЯ ТЕМА (пасхалка) ─── */
        .banana-theme {
            --bg-body: #fff8e0 !important;
            --bg-card: #fff5d0 !important;
            --bg-header: #fff0c0 !important;
            --text-primary: #8a7a30 !important;
            --text-secondary: #b09040 !important;
            --text-light: #c0a050 !important;
            --border-light: #e8d090 !important;
            --shadow-sm: 0 2px 8px rgba(180, 140, 40, 0.15) !important;
            --shadow-md: 0 6px 24px rgba(180, 140, 40, 0.2) !important;
            --pastel-blue: #f5e8b0 !important;
            --pastel-green: #f0e0a0 !important;
            --pastel-red: #f5d8a0 !important;
            --pastel-yellow: #f5f0b0 !important;
            --level-1: #f5e8b0 !important;
            --level-2: #f0e0a0 !important;
            --level-3: #f5d8a0 !important;
            --btn-primary-bg: #f5e8b0 !important;
            --btn-primary-color: #7a6a30 !important;
            --btn-success-bg: #f0e0a0 !important;
            --btn-success-color: #7a6a30 !important;
            --btn-danger-bg: #f5d8a0 !important;
            --btn-danger-color: #7a6a30 !important;
            --btn-warning-bg: #f5f0b0 !important;
            --btn-warning-color: #7a6a30 !important;
        }
        .banana-theme .olympiad-bar {
            border-color: #e8d080 !important;
        }
        .banana-theme .olympiad-bar .bar-tooltip {
            background: #f5e8b0 !important;
            color: #7a6a30 !important;
        }
        .banana-theme .sidebar-toggle .badge {
            background: #f5d8a0 !important;
            color: #7a6a30 !important;
        }
        .banana-theme .reg-sidebar-item.active {
            background: #f5e0b0 !important;
        }
        .banana-theme .reg-sidebar-item.upcoming {
            background: #f5f0b0 !important;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 0 16px 40px;
            min-height: 100vh;
            transition: background var(--transition), color var(--transition);
        }

        /* ────────────── СКРОЛЛБАР ────────────── */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-body);
        }
        ::-webkit-scrollbar-thumb {
            background: #d5cec6;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #c0b8ae;
        }
        [data-theme="dark"] ::-webkit-scrollbar-thumb {
            background: #5a5a5a;
        }
        [data-theme="dark"] ::-webkit-scrollbar-thumb:hover {
            background: #707070;
        }

        /* ────────────── ЗАГРУЗОЧНЫЙ СПИННЕР ────────────── */
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid var(--border-light);
            border-top-color: var(--text-secondary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loading-overlay {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        /* ────────────── КОНТЕЙНЕРЫ ────────────── */
        .app {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ────────────── ШАПКА ────────────── */
        .app-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 18px 0 12px;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 20px;
            gap: 12px 16px;
        }
        .app-header h1 {
            font-weight: 400;
            font-size: 1.6rem;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .header-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        /* ────────────── КНОПКИ ────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 450;
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg-card);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
            text-decoration: none;
            white-space: nowrap;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn-primary {
            background: var(--pastel-blue);
            color: #2a4a5a;
        }
        .btn-primary:hover {
            background: #d0dde8;
        }
        .btn-success {
            background: var(--pastel-green);
            color: #1a4a3a;
        }
        .btn-success:hover {
            background: #c8e0d4;
        }
        .btn-danger {
            background: var(--pastel-red);
            color: #7a3a3a;
        }
        .btn-danger:hover {
            background: #f0c8c8;
        }
        .btn-warning {
            background: var(--pastel-yellow);
            color: #6a5a2a;
        }
        .btn-warning:hover {
            background: #ebe0c0;
        }
        .btn-outline {
            background: transparent;
            box-shadow: none;
            border: 1px solid var(--border-light);
            color: var(--text-primary);
        }
        .btn-outline:hover {
            background: var(--bg-header);
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 0.8rem;
        }
        .btn-icon {
            padding: 6px 10px;
            border-radius: 30px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text-secondary);
            transition: var(--transition);
        }
        .btn-icon:hover {
            background: var(--bg-header);
            color: var(--text-primary);
        }

        /* ─── ТЁМНАЯ ТЕМА: КНОПКИ ─── */
        [data-theme="dark"] .btn-primary {
            background: #4a6a7a;
            color: #e8e0d8;
        }
        [data-theme="dark"] .btn-primary:hover {
            background: #5a7a8a;
        }
        [data-theme="dark"] .btn-success {
            background: #4a7a5a;
            color: #e8e0d8;
        }
        [data-theme="dark"] .btn-success:hover {
            background: #5a8a6a;
        }
        [data-theme="dark"] .btn-danger {
            background: #7a4a4a;
            color: #e8e0d8;
        }
        [data-theme="dark"] .btn-danger:hover {
            background: #8a5a5a;
        }
        [data-theme="dark"] .btn-warning {
            background: #7a6a3a;
            color: #e8e0d8;
        }
        [data-theme="dark"] .btn-warning:hover {
            background: #8a7a4a;
        }
        [data-theme="dark"] .btn-outline {
            color: var(--text-primary);
            border-color: var(--border-light);
        }
        [data-theme="dark"] .btn-outline:hover {
            background: var(--bg-header);
        }
        [data-theme="dark"] .btn-icon {
            color: var(--text-secondary);
        }
        [data-theme="dark"] .btn-icon:hover {
            color: var(--text-primary);
        }

        /* ────────────── КАЛЕНДАРЬ ────────────── */
        .calendar-wrapper {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            overflow: hidden;
            position: relative;
        }

        .calendar-scroll {
            max-height: 82vh;
            overflow-y: auto;
            padding: 0 2px 12px 2px;
            scroll-behavior: smooth;
        }

        /* ───── МЕСЯЦ ───── */
        .month-block {
            padding: 16px 12px 4px 12px;
        }
        .month-label {
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--text-secondary);
            padding: 6px 0 10px 6px;
            letter-spacing: -0.2px;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 10px;
        }

        /* ───── ДНИ НЕДЕЛИ (шапка) ───── */
        .week-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            padding: 0 4px 6px 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-light);
            font-weight: 500;
            text-align: center;
        }
        .week-header span {
            padding: 4px 0;
        }

        /* ───── НЕДЕЛЯ ───── */
        .week-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            padding: 0 4px;
            margin-bottom: 2px;
        }

        /* ───── ДЕНЬ ───── */
        .day-cell {
            background: var(--bg-body);
            border-radius: var(--radius-sm);
            padding: 4px 6px 6px 6px;
            min-height: 72px;
            transition: var(--transition);
            position: relative;
            border: 1px solid transparent;
        }
        .day-cell.other-month {
            opacity: 0.4;
        }
        .day-cell.today {
            background: #f5f0ea;
            border-color: #d5cec6;
        }
        [data-theme="dark"] .day-cell.today {
            background: #3a3a3a;
            border-color: #606060;
        }
        .day-cell .day-number {
            font-size: 0.8rem;
            font-weight: 450;
            color: var(--text-secondary);
            padding-bottom: 2px;
            display: block;
            text-align: right;
        }
        .day-cell.today .day-number {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* ───── ПОЛОСЫ ОЛИМПИАД ───── */
        .day-bars {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-height: 18px;
        }

        .olympiad-bar {
            position: relative;
            border-radius: var(--radius-sm);
            padding: 2px 8px 2px 8px;
            font-size: 0.7rem;
            font-weight: 450;
            line-height: 1.4;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-height: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            user-select: none;
        }
        .olympiad-bar:hover {
            filter: brightness(0.96);
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
            z-index: 2;
        }
        [data-theme="dark"] .olympiad-bar:hover {
            filter: brightness(1.1);
        }
        .olympiad-bar.bar-cut-left {
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }
        .olympiad-bar.bar-cut-right {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }
        .olympiad-bar.bar-cut-both {
            border-radius: 0;
        }

        .olympiad-bar .bar-tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 6px);
            left: 0;
            background: #2a2a2a;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            white-space: normal;
            max-width: 280px;
            z-index: 20;
            font-weight: 400;
            pointer-events: none;
            box-shadow: var(--shadow-md);
        }
        [data-theme="dark"] .olympiad-bar .bar-tooltip {
            background: #e0d8d0;
            color: #2a2a2a;
        }
        .olympiad-bar:hover .bar-tooltip {
            display: block;
        }

        /* ────────────── МОДАЛЬНОЕ ОКНО ────────────── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(30, 28, 26, 0.35);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.97);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .modal-box {
            background: var(--bg-card);
            border-radius: var(--radius);
            max-width: 620px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px 32px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            position: relative;
            color: var(--text-primary);
        }
        .modal-box .modal-close {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
            color: var(--text-light);
            transition: var(--transition);
            line-height: 1;
        }
        .modal-box .modal-close:hover {
            color: var(--text-primary);
        }
        .modal-box h2 {
            font-weight: 400;
            font-size: 1.5rem;
            margin-bottom: 16px;
            padding-right: 32px;
            color: var(--text-primary);
        }
        .modal-box .field {
            display: flex;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-light);
            font-size: 0.92rem;
        }
        .modal-box .field .label {
            font-weight: 450;
            min-width: 120px;
            color: var(--text-secondary);
        }
        .modal-box .field .value {
            color: var(--text-primary);
            word-break: break-word;
        }
        .modal-box .field:last-child {
            border-bottom: none;
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        /* ────────────── ФОРМА ────────────── */
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 450;
            color: var(--text-secondary);
            margin-bottom: 3px;
        }
        .form-group label .required {
            color: #c05050;
            margin-left: 2px;
        }
        [data-theme="dark"] .form-group label .required {
            color: #e07070;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            background: var(--bg-body);
            transition: var(--transition);
            color: var(--text-primary);
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #b8b0a8;
            box-shadow: 0 0 0 3px rgba(180, 170, 160, 0.15);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .form-group .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
        }
        .form-group .checkbox-group input[type="checkbox"] {
            width: auto;
            accent-color: var(--text-secondary);
            transform: scale(1.1);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .color-preview {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            flex-shrink: 0;
        }

        /* ────────────── САЙДБАР (регистрации) ────────────── */
        .sidebar-toggle {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-left: none;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            padding: 12px 8px 12px 10px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            z-index: 50;
            font-size: 1.2rem;
            transition: var(--transition);
            color: var(--text-secondary);
        }
        .sidebar-toggle:hover {
            background: var(--bg-header);
        }
        .sidebar-toggle .badge {
            display: block;
            font-size: 0.6rem;
            background: var(--pastel-red);
            color: #5a3a3a;
            border-radius: 20px;
            padding: 0 6px;
            text-align: center;
            margin-top: 2px;
        }
        [data-theme="dark"] .sidebar-toggle .badge {
            background: #6a4a4a;
            color: #f0d8d8;
        }

        .registration-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 340px;
            max-width: 80vw;
            background: var(--bg-card);
            border-right: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
            z-index: 60;
            transform: translateX(-110%);
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            padding: 20px 16px 20px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .registration-sidebar.open {
            transform: translateX(0);
        }
        .registration-sidebar .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 16px;
        }
        .registration-sidebar .sidebar-header h3 {
            font-weight: 400;
            font-size: 1.1rem;
            color: var(--text-primary);
        }
        .registration-sidebar .sidebar-close {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text-light);
        }
        .registration-sidebar .sidebar-close:hover {
            color: var(--text-primary);
        }

        .reg-sidebar-item {
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            background: var(--bg-body);
            margin-bottom: 8px;
            border-left: 4px solid var(--pastel-blue);
            transition: var(--transition);
        }
        .reg-sidebar-item.active {
            border-left-color: var(--pastel-red);
            background: #f8ecec;
        }
        .reg-sidebar-item.upcoming {
            border-left-color: var(--pastel-yellow);
            background: #f8f4e8;
        }
        [data-theme="dark"] .reg-sidebar-item.active {
            background: #3a2a2a;
        }
        [data-theme="dark"] .reg-sidebar-item.upcoming {
            background: #3a3a2a;
        }
        .reg-sidebar-item .s-name {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        function formatDate(d) {
            if (!d) return '—';
            if (d.toDate) d = d.toDate();
            return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit',
                minute: '2-digit' });
        }

            return `hsl(${hue}, ${sat}%, ${light}%)`;

        // Функция для определения цвета текста (чёрный или белый) по яркости фона
        function getContrastColor(hslColor) {

            const match = hslColor.match(/hsl\(\s*(\d+)\s*,\s*(\d+)%\s*,\s*(\d+)%\s*\)/);
            if (match) {
                const light = parseInt(match[3], 10);
                return light > 55 ? '#2a2a2a' : '#f0f0f0';

        // ──── ГЕНЕРАЦИЯ КАЛЕНДАРЯ ────
        function buildCalendar(startDate, endDate) {
            const start = dateOnly(startDate);
            const end = dateOnly(endDate);
            if (!start || !end) return [];

            const months = [];
            let cursor = new Date(start);

            while (cursor <= end) {
                const year = cursor.getFullYear();
                const month = cursor.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const monthStart = new Date(Math.max(firstDay.getTime(), start.getTime()));
                const monthEnd = new Date(Math.min(lastDay.getTime(), end.getTime()));

                let weekStart = new Date(monthStart);
                const dow = weekStart.getDay();
                const diff = (dow === 0 ? 6 : dow - 1);
                weekStart.setDate(weekStart.getDate() - diff);

                const weeks = [];
                let weekCursor = new Date(weekStart);

                while (weekCursor <= monthEnd) {
                    const week = [];
                    for (let i = 0; i < 7; i++) {
                        const d = new Date(weekCursor);
                        week.push(d);
                        weekCursor.setDate(weekCursor.getDate() + 1);
                    }
                    weeks.push(week);
                }

                months.push({
                    year,
                    month,
                    label: `${['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'][month]} ${year}`,
                    weeks,
                    start: monthStart,
                    end: monthEnd,
                });

                cursor = new Date(year, month + 1, 1);
            }

            return months;
        }

        // ──── ПОЛУЧЕНИЕ ПОЛОС ДЛЯ ДНЯ ────
        function getBarsForDay(olympiads, dayDate) {
            const day = dateOnly(dayDate);
            if (!day) return [];
            const result = [];
            for (const o of olympiads) {
                const start = dateOnly(o.startTime);
                const end = dateOnly(o.endTime);
                if (!start || !end) continue;
                if (day >= start && day <= end) {
                    result.push(o);
                }
            }
            result.sort((a, b) => {
                const da = dateOnly(a.endTime) - dateOnly(a.startTime);
                const db = dateOnly(b.endTime) - dateOnly(b.startTime);
                return db - da;
            });
            return result;
        }

            if (!start || !end) return null;
            if (now >= start && now <= end) return 'active';
            if (now < start) {
                const diff = (start - now) / (1000 * 60 * 60 * 24);
                if (diff < 3) return 'upcoming';
            }
            return null;

                            disabled: saving
                        }),
                        React.createElement('label', { htmlFor: 'regRequired' }, 'Требуется регистрация')
                    )
                ),
                form.registrationRequired && React.createElement(React.Fragment, null,
                    React.createElement('div', { className: 'form-row' },
                        React.createElement('div', { className: 'form-group' },
                            React.createElement('label', null, 'Начало регистрации'),
                            React.createElement('input', {
                                type: 'datetime-local',
                                value: form.registrationStart,
                                onChange: e => handleChange('registrationStart', e.target.value),
                                disabled: saving
                            })
                        ),
                        React.createElement('div', { className: 'form-group' },
                            React.createElement('label', null, 'Окончание регистрации'),
                            React.createElement('input', {
                                type: 'datetime-local',
                                value: form.registrationEnd,
                                onChange: e => handleChange('registrationEnd', e.target.value),
                                disabled: saving
                            })
                        )
                    ),
                    React.createElement('div', { className: 'form-group' },
                        React.createElement('label', null, 'Ссылка на регистрацию'),
                        React.createElement('input', {
                            type: 'url',
                            value: form.registrationUrl || '',
                            onChange: e => handleChange('registrationUrl', e.target.value),
                            placeholder: 'https://...',
                            disabled: saving
                        })
                    )
                ),
                React.createElement('div', { className: 'form-actions' },
                    React.createElement('button', { type: 'submit', className: 'btn btn-success', disabled: saving },
                        saving ? 'Сохранение...' : olympiad ? 'Сохранить' : 'Добавить'
                    ),
                    React.createElement('button', { type: 'button', className: 'btn btn-outline', onClick: onCancel,
                        disabled: saving }, 'Отмена')
                )
            );
        }

        // ──── ПОЛОСА ОЛИМПИАДЫ ────
        function OlympiadBar({ olympiad, isFirst, isLast, onRightClick, onEdit, onLeftClick }) {
            let cutClass = '';
            if (!isFirst && !isLast) cutClass = 'bar-cut-both';
            else if (!isFirst) cutClass = 'bar-cut-left';
            else if (!isLast) cutClass = 'bar-cut-right';

            const bgColor = olympiad.color || '#dce8f0';
            // Вычисляем контрастный цвет текста
            const textColor = getContrastColor(bgColor);

            const handleContext = (e) => {
                e.preventDefault();
                if (onRightClick) onRightClick(olympiad);
            };

            const handleLeftClick = (e) => {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    if (onEdit) onEdit(olympiad);
                } else {
                    // обычный клик — открываем модалку
                    if (onLeftClick) onLeftClick(olympiad);
                }
            };

            return React.createElement('div', {
                className: `olympiad-bar ${cutClass}`,
                style: { backgroundColor: bgColor, color: textColor },
                onContextMenu: handleContext,
                onClick: handleLeftClick,
                title: olympiad.name || 'Без названия'
            },
                olympiad.name || 'Без названия',
                React.createElement('div', { className: 'bar-tooltip' },
                    React.createElement('strong', null, olympiad.name || 'Без названия'),
                    React.createElement('br', null),
                    `${olympiad.level || ''} · ${olympiad.direction || ''}`,
                    olympiad.type && React.createElement(React.Fragment, null, React.createElement('br', null),
                        `Формат: ${olympiad.type}`)
                )
            );
        }

        // ──── ЯЧЕЙКА ДНЯ ────
        function DayCell({ date, olympiads, isToday, isOtherMonth, onBarRightClick, onBarEdit, onBarLeftClick }) {
            const dayBars = getBarsForDay(olympiads, date);
            const dayNum = date.getDate();

            const bars = dayBars.map(o => {
                const start = dateOnly(o.startTime);
                const end = dateOnly(o.endTime);
                const d = dateOnly(date);
                return {
                    ...o,
                    isFirst: d && start && d.getTime() === start.getTime(),
                    isLast: d && end && d.getTime() === end.getTime(),
                };
            });

            return React.createElement('div', {
                className: `day-cell ${isOtherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''}`
            },
                React.createElement('span', { className: 'day-number' }, dayNum),
                React.createElement('div', { className: 'day-bars' },
                    bars.map((o, idx) => React.createElement(OlympiadBar, {
                        key: o.id + '-' + idx,
                        olympiad: o,
                        isFirst: o.isFirst,
                        isLast: o.isLast,
                        onRightClick: onBarRightClick,
                        onEdit: onBarEdit,
                        onLeftClick: onBarLeftClick,
                    }))
                )
            );
        }

        // ──── НЕДЕЛЯ ────
        function WeekRow({ week, olympiads, today, onBarRightClick, onBarEdit, onBarLeftClick }) {
            return React.createElement('div', { className: 'week-row' },
                week.map((day, idx) => {
                    const isToday = today && isSameDay(day, today);
                    const isOtherMonth = false;
                    return React.createElement(DayCell, {
                        key: idx,
                        date: day,
                        olympiads,
                        isToday,
                        isOtherMonth,
                        onBarRightClick,
                        onBarEdit,
                        onBarLeftClick,
                    });
                })
            );
        }

        // ──── МЕСЯЦ ────
        function MonthBlock({ month, olympiads, today, onBarRightClick, onBarEdit, onBarLeftClick }) {
            const weekDays = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
            const isInMonth = (d) => d.getMonth() === month.month && d.getFullYear() === month.year;

            return React.createElement('div', { className: 'month-block' },
                React.createElement('div', { className: 'month-label' }, month.label),
                React.createElement('div', { className: 'week-header' },
                    weekDays.map(d => React.createElement('span', { key: d }, d))
                ),
                month.weeks.map((week, wi) => {
                    const hasMonthDays = week.some(d => isInMonth(d));
                    if (!hasMonthDays) return null;
                    return React.createElement(WeekRow, {
                        key: wi,
                        week: week,
                        olympiads,
                        today,
                        onBarRightClick,
                        onBarEdit,
                        onBarLeftClick,
                    });
                })
            );
        }

        // ──── КАЛЕНДАРЬ ────
        function Calendar({ olympiads, onBarRightClick, onBarEdit, onBarLeftClick }) {
            const [today] = useState(new Date());
            const scrollRef = useRef(null);
            const [hasScrolled, setHasScrolled] = useState(false);

            const startDate = new Date(2026, 7, 1);
            const endDate = new Date(2027, 7, 1);
            const months = buildCalendar(startDate, endDate);

            useEffect(() => {
                if (!scrollRef.current || hasScrolled) return;
                const todayStr = dateOnly(today)?.toISOString().slice(0, 10);
                if (!todayStr) return;

                let found = false;
                for (let mi = 0; mi < months.length; mi++) {
                    const m = months[mi];
                    for (let wi = 0; wi < m.weeks.length; wi++) {
                        const week = m.weeks[wi];
                        for (const d of week) {
                            if (dateOnly(d)?.toISOString().slice(0, 10) === todayStr) {
                                const target = scrollRef.current.querySelector(
                                    `.month-block:nth-child(${mi+1}) .week-row:nth-child(${wi+2})`
                                );
                                if (target) {
                                    setTimeout(() => {
                                        target.scrollIntoView({ block: 'start', behavior: 'smooth' });
                                    }, 100);
                                }
                                found = true;
                                break;
                            }
                        }
                        if (found) break;
                    }
                    if (found) break;
                }
                setHasScrolled(true);
            }, [months, today, hasScrolled]);

            if (months.length === 0) {
                return React.createElement('div', { className: 'text-center text-muted', style: { padding: '40px 0' } },
                    'Нет данных для отображения'
                );
            }

            return React.createElement('div', { className: 'calendar-wrapper' },
                React.createElement('div', { className: 'calendar-scroll', ref: scrollRef },
                    months.map((m, idx) => React.createElement(MonthBlock, {
                        key: idx,
                        month: m,
                        olympiads,
                        today,
                        onBarRightClick,
                        onBarEdit,
                        onBarLeftClick,
                    }))
                )
            );
        }

        // ──── САЙДБАР РЕГИСТРАЦИЙ ────
        function RegistrationSidebar({ olympiads, isOpen, onClose }) {
            const now = new Date();
            const items = [];

            for (const o of olympiads) {
                if (!o.registrationRequired) continue;
                const start = toDate(o.registrationStart);
                const end = toDate(o.registrationEnd);
                if (!start || !end) continue;
                if (now <= end) {
                    const status = (now >= start && now <= end) ? 'active' : 'upcoming';
                    items.push({ ...o, _status: status, _start: start, _end: end });
                }
            }

            items.sort((a, b) => a._start - b._start);

            return React.createElement('div', { className: `registration-sidebar ${isOpen ? 'open' : ''}` },
                React.createElement('div', { className: 'sidebar-header' },
                    React.createElement('h3', null, '📋 Регистрации'),
                    React.createElement('button', { className: 'sidebar-close', onClick: onClose }, '✕')
                ),
                items.length === 0 ?
                React.createElement('div', { className: 'text-muted', style: { padding: '16px 0' } },
                    'Нет олимпиад с регистрацией'
                ) :
                items.map(o => {
                    const statusLabel = o._status === 'active' ? '🔴 Открыта' : '🟡 Скоро';
                    return React.createElement('div', { key: o.id, className: `reg-sidebar-item ${o._status}` },
                        React.createElement('div', { className: 's-name' }, o.name || 'Без названия'),
                        React.createElement('div', { className: 's-meta' },
                            React.createElement('span', null, statusLabel),
                            React.createElement('span', null,
                                `${formatDate(o.registrationStart)} — ${formatDate(o.registrationEnd)}`
                            ),
                            o.registrationUrl && React.createElement('a', {
                                href: o.registrationUrl,
                                target: '_blank',
                                rel: 'noopener',
                                className: 's-link'
                            }, '🔗 Ссылка')
                        )
                    );
                })
            );
        }

        // ──── ГЛАВНЫЙ КОМПОНЕНТ ────
        function App() {
            const { items: olympiads, loading, error } = useOlympiads();
            const { user, loading: authLoading, login, logout } = useAuth();

            const [selectedOlympiad, setSelectedOlympiad] = useState(null);
            const [editingOlympiad, setEditingOlympiad] = useState(null);
            const [showForm, setShowForm] = useState(false);
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [theme, setTheme] = useState(() => {
                return localStorage.getItem('theme') || 'light';
            });
            const [bananaActive, setBananaActive] = useState(false);
            const [previousTheme, setPreviousTheme] = useState('light');
            const [clickCount, setClickCount] = useState(0);
            const [clickTimer, setClickTimer] = useState(null);

            // Применяем тему и класс банана
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                // Убираем банановый класс, если он был
                document.documentElement.classList.remove('banana-theme');
                if (bananaActive) {
                    document.documentElement.classList.add('banana-theme');
                }
            }, [theme, bananaActive]);

            const toggleTheme = () => {
                // Если банановая активна — выключаем её и возвращаем предыдущую тему
                if (bananaActive) {
                    setBananaActive(false);
                    setTheme(previousTheme);
                    setClickCount(0);
                    if (clickTimer) {
                        clearTimeout(clickTimer);
                        setClickTimer(null);
                    }
                    return;
                }

                // Обработка пасхалки: считаем клики
                const now = Date.now();
                if (clickCount === 0) {
                    // первый клик, запускаем таймер на 10 секунд
                    const timer = setTimeout(() => {
                        setClickCount(0);
                        setClickTimer(null);
                    }, 10000);
                    setClickTimer(timer);
                }
                const newCount = clickCount + 1;
                setClickCount(newCount);
                if (newCount > 5) {
                    // Активируем банановую тему
                    setPreviousTheme(theme);
                    setBananaActive(true);
                    setClickCount(0);
                    if (clickTimer) {
                        clearTimeout(clickTimer);
                        setClickTimer(null);
                    }
                    return;
                }

                // Обычное переключение светлая/тёмная
                setTheme(prev => prev === 'light' ? 'dark' : 'light');
            };

            const isAdmin = user && (ADMIN_UID ? user.uid === ADMIN_UID : true);

            const handleBarRightClick = (olympiad) => {
                setSelectedOlympiad(olympiad);
            };

            const handleBarLeftClick = (olympiad) => {
                setSelectedOlympiad(olympiad);
            };

            const handleBarEdit = (olympiad) => {
                if (!isAdmin) return;
                setEditingOlympiad(olympiad);
                setShowForm(true);
            };

            const handleAdd = () => {
                if (!isAdmin) return;
                setEditingOlympiad(null);
                setShowForm(true);
            };

            const handleFormSave = () => {
                setShowForm(false);
                setEditingOlympiad(null);
            };

            const handleFormCancel = () => {
                setShowForm(false);
                setEditingOlympiad(null);
            };

            const handleDelete = async (id) => {
                if (!isAdmin || !id) return;
                if (!window.confirm('Удалить эту олимпиаду?')) return;
                try {
                    await db.collection('olympiads').doc(id).delete();
                    setSelectedOlympiad(null);
                } catch (err) {
                    alert('Ошибка удаления: ' + err.message);
                }
            };

            const handleLogin = async () => {
                const email = prompt('Email:');
                if (!email) return;
                const password = prompt('Пароль:');
                if (!password) return;
                try {
                    await login(email, password);
                } catch (err) {
                    alert('Ошибка входа: ' + err.message);
                }
            };

            const handleLogout = () => logout();

            // ──── РЕНДЕР ────
            if (authLoading || loading) {
                return React.createElement('div', { className: 'app' },
                    React.createElement('div', { className: 'app-header' },
                        React.createElement('h1', null, '📅 Расписание олимпиад')
                    ),
                    React.createElement(Spinner, { text: 'Загрузка...' })
                );
            }

            if (error) {
                return React.createElement('div', { className: 'app' },
                    React.createElement('div', { className: 'app-header' },
                        React.createElement('h1', null, '📅 Расписание олимпиад')
                    ),
                    React.createElement('div', { style: { padding: 40, textAlign: 'center', color: '#8a5a5a' } },
                        '⚠️ Ошибка загрузки данных: ', error,
                        React.createElement('br', null),
                        React.createElement('button', { className: 'btn btn-outline mt-8', onClick: () => window
                                .location.reload() }, 'Обновить')
                    )
                );
            }

            return React.createElement('div', { className: 'app' },
                // Шапка
                React.createElement('div', { className: 'app-header' },
                    React.createElement('h1', null, '📅 Расписание олимпиад'),
                    React.createElement('div', { className: 'header-actions' },
                        isAdmin && React.createElement('button', { className: 'btn btn-primary', onClick: handleAdd },
                            '➕ Добавить'
                        ),
                        !user ?
                        React.createElement('button', { className: 'btn btn-outline', onClick: handleLogin },
                            '🔑 Вход для админа'
                        ) :
                        React.createElement(React.Fragment, null,
                            React.createElement('span', { style: { fontSize: '0.85rem', color: 'var(--text-light)' } },
                                '👤 ' + (user.email || 'admin')
                            ),
                            React.createElement('button', { className: 'btn btn-outline btn-sm', onClick: handleLogout },
                                'Выйти'
                            )
                        ),
                        React.createElement('button', {
                            className: 'btn btn-outline btn-sm',
                            onClick: toggleTheme,
                            style: { marginLeft: '4px' }
                        },
                            bananaActive ? '🍌' : (theme === 'light' ? '🌙' : '☀️')
                        )
                    )
                ),

                // Календарь
                React.createElement(Calendar, {
                    olympiads,
                    onBarRightClick: handleBarRightClick,
                    onBarEdit: handleBarEdit,
                    onBarLeftClick: handleBarLeftClick,
                }),

                // Кнопка-триггер сайдбара
                React.createElement('button', {
                    className: 'sidebar-toggle',
                    onClick: () => setSidebarOpen(true),
                    title: 'Список регистраций'
                },
                    '📋',
                    React.createElement('span', { className: 'badge' },
                        olympiads.filter(o => o.registrationRequired && toDate(o.registrationEnd) >= new Date()).length
                    )
                ),

                // Сайдбар
                React.createElement(RegistrationSidebar, {
                    olympiads,
                    isOpen: sidebarOpen,
                    onClose: () => setSidebarOpen(false),
                }),

                // Модальное окно просмотра
                selectedOlympiad && React.createElement(Modal, {
                    olympiad: selectedOlympiad,
                    onClose: () => setSelectedOlympiad(null),
                    onEdit: (o) => {
                        if (isAdmin) {
                            setEditingOlympiad(o);
                            setShowForm(true);
                            setSelectedOlympiad(null);
                        }
                    },
                    isAdmin,
                }),

                // Форма добавления/редактирования
                showForm && React.createElement('div', { className: 'modal-overlay', onClick: (e) => { if (e.target === e
                            .currentTarget) handleFormCancel(); } },
                    React.createElement('div', { className: 'modal-box', style: { maxWidth: 720 } },
                        React.createElement('button', { className: 'modal-close', onClick: handleFormCancel }, '×'),
                        React.createElement('h2', null, editingOlympiad ? '✎ Редактирование' : '➕ Новая олимпиада'),
                        React.createElement(OlympiadForm, {
                            olympiad: editingOlympiad,
                            onSave: handleFormSave,
                            onCancel: handleFormCancel,
                        }),
                        editingOlympiad && React.createElement('div', { style: { marginTop: 12, borderTop: '1px solid var(--border-light)',
                                paddingTop: 12 } },
                            React.createElement('button', {
                                className: 'btn btn-danger btn-sm',
                                onClick: () => {
                                    if (editingOlympiad.id) {
                                        handleDelete(editingOlympiad.id);
                                        handleFormCancel();
                                    }
                                }
                            }, '🗑 Удалить')
                        )
                    )
                )
            );
        }

        // ──────────────────────────────────────────────────────────────
        // 5.  РЕНДЕР
        // ──────────────────────────────────────────────────────────────
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>

</body>
</html>
